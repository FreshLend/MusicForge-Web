{% extends "base.html" %}
{% block content %}
<h2 class="mb-4">Весь чарт (за месяц)</h2>
<div class="row" id="tracks-grid">
    {% for track in tracks %}
        {% include '_track_card.html' %}
    {% endfor %}
</div>
<div id="infinite-sentinel" style="height: 20px;"></div>
{% endblock %}

{% block scripts %}
<script>
    window.initInfiniteScroll('tracks-grid', 'infinite-sentinel', '/api/web/tracks', 'popular');
</script>
{% endblock %}
