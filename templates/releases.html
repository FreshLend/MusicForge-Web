{% extends "base.html" %}
{% block content %}
<h2 class="mb-4">Все релизы</h2>
<div class="row" id="tracks-grid">
    {% for track in tracks.items %}
        {% include '_track_card.html' %}
    {% endfor %}
</div>
<div id="infinite-sentinel" style="height: 20px;"></div>
{% endblock %}

{% block scripts %}
<script>
    window.initInfiniteScroll('tracks-grid', 'infinite-sentinel', '/api/web/tracks', 'new');
</script>
{% endblock %}
